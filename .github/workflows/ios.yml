
name: Screen Off iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScreenOff-iOS/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XCodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ScreenOff-iOS/ScreenOff-iOS
        run: xcodegen generate

      - name: Build iOS Simulator app
        working-directory: ScreenOff-iOS/ScreenOff-iOS
        run: |
          xcodebuild \
            -project ScreenOff.xcodeproj \
            -scheme ScreenOff \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Simulator app
        run: |
          test -d "ScreenOff-iOS/ScreenOff-iOS/build/DerivedData/Build/Products/Debug-iphonesimulator/Screen Off.app"
          echo "Simulator app found successfully"

      - name: Zip Simulator app
        run: |
          cd ScreenOff-iOS/ScreenOff-iOS/build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent "Screen Off.app" ScreenOff.zip

      - name: Upload Simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOff-iOS-Simulator
          path: ScreenOff-iOS/ScreenOff-iOS/build/DerivedData/Build/Products/Debug-iphonesimulator/ScreenOff.zip
