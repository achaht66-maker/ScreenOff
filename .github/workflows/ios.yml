
name: Screen Off iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScreenOff-iOS/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XCodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ScreenOff-iOS/ScreenOff-iOS
        run: xcodegen generate

      - name: Archive iPhone app
        working-directory: ScreenOff-iOS/ScreenOff-iOS
        run: |
          xcodebuild \
            -project ScreenOff.xcodeproj \
            -scheme ScreenOff \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScreenOff.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload iPhone archive
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOff-iPhone-Archive
          path: ScreenOff-iOS/ScreenOff-iOS/build/ScreenOff.xcarchive
